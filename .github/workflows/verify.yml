- name: Debug verification report
  if: always()
  run: |
    echo "=== Contenu du rapport ==="
    if [ -f verify-report.txt ]; then
      cat verify-report.txt
    else
      echo "ERREUR : verify-report.txt introuvable"
      exit 1
    fi

    echo "=== Recherche du résumé ==="
    grep -n 'RÉSUMÉ' verify-report.txt || true

    echo "=== Recherche des échecs ==="
    grep -n '^ÉCHEC' verify-report.txt || true
            echo '```'; echo '## Fin du rapport (pour diagnostiquer)'; echo '```'
            tail -n 80 verify-report.txt; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-report
          path: verify-report.txt
      - name: Échouer si une étape est en échec
        run: "grep -q 'RÉSUMÉ' verify-report.txt && ! grep -q '^ÉCHEC' verify-report.txt"
